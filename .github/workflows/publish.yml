name: Publish NuGet package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for NuGet trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Compute version
        run: |
          BASE=$(grep -oPm1 '(?<=<PackageVersion>)[^<]+' AquaLogicSharp/AquaLogicSharp.csproj)
          MAJOR_MINOR=$(echo "$BASE" | cut -d. -f1,2)
          echo "VERSION=$MAJOR_MINOR.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version=$VERSION -p:PackageVersion=$VERSION

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack AquaLogicSharp/AquaLogicSharp.csproj --configuration Release --no-build --output ./artifacts -p:Version=$VERSION -p:PackageVersion=$VERSION

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
